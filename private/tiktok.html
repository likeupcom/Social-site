<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok Promotion Center</title>

<!-- FontAwesome Icons Clean CDN Link -->
<link rel="stylesheet" href="https://cloudflare.com"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b1220;
  color:#fff;
  min-height:100vh;
  padding-bottom:110px;
  overflow-x:hidden;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
  background:#111827;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo-container{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#38bdf8;
}

.container{
  text-align:center;
  padding:40px 20px;
}

h1{
  font-size:28px;
  margin-bottom:30px;
  color:#38bdf8;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
  margin-bottom: 35px;
}

.tool-btn{
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  color:#fff;
  transition:.3s;
  width:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.tool-btn:hover:not(:disabled){
  background:rgba(56, 189, 248, 0.2);
  border: 1px solid #38bdf8;
}

.tool-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* Link Input Area Styles */
.link-box {
  background: #111827;
  border: 1px solid #1f2937;
  border-radius: 12px;
  max-width: 500px;
  margin: 0 auto 40px;
  padding: 25px;
}

.link-box h3 {
  font-size: 16px;
  margin-bottom: 4px;
  color: #cbd5e1;
}

.example-txt {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 16px;
  display: block;
}

.input-group {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.link-input {
  flex: 1;
  background: #0b1220;
  border: 1px solid #38bdf8;
  border-radius: 6px;
  padding: 10px 14px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.action-btn {
  padding: 10px 20px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}

.upload-style {
  background: #38bdf8;
  color: #0b1220;
}

.upload-style:hover:not(:disabled) {
  background: #0ea5e9;
}

.upload-style:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.change-style {
  background: #ef4444;
  color: #fff;
}

.change-style:hover {
  background: #dc2626;
}

.hint-txt {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 12px;
  line-height: 1.4;
  display: block;
}

.notify-msg {
  font-size: 13px;
  margin-top: 10px;
  min-height: 18px;
  font-weight: bold;
}

.error-text { color: #ef4444; }
.success-text { color: #22c55e; }

footer{
  background:#111827;
  padding:45px 20px 60px;
  text-align:center;
}

.footer-text{
  max-width:900px;
  margin:auto;
  line-height:1.6;
  color:#cbd5e1;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  border-top:1px solid #1f2937;
  z-index:1500;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#cbd5e1;
  font-weight:bold;
  font-size:12px;
  transition: 0.2s;
}

.nav-item span:first-child{font-size:20px; margin-bottom: 4px;}
.nav-item:hover{color:#38bdf8;}
.nav-item.active{color:#38bdf8;}

/* Sidebar Styles */
.sidebar{
  position:fixed;
  left:-250px;
  top:0;
  height:100%;
  width:200px;
  background:#111827;
  padding-top:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
  border-right:1px solid #1f2937;
  transition:.3s;
  z-index:2000;
}
.sidebar.open{left:0;}

.lang-btn{
  background:none;
  border:1px solid #38bdf8;
  color:white;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  width:140px;
  text-align:center;
}
.lang-btn:hover{
  background:#38bdf8;
  color:#000;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <button class="lang-btn" onclick="applyLang('en')">English</button>
  <button class="lang-btn" onclick="applyLang('fr')">Français</button>
  <button class="lang-btn" onclick="applyLang('rw')">Kinyarwanda</button>
</div>

<header>
  <div class="logo-container">
    <div class="logo" id="title" style="cursor:pointer;" onclick="document.getElementById('sidebar').classList.toggle('open')">TikTok Promotion Center</div>
  </div>
  <a href="index.html" style="color:#38bdf8;text-decoration:none;font-size:26px;display:flex;align-items:center;">
    →
  </a>
</header>

<div class="container">
  <h1 id="pageTitle">TikTok Promotion Center</h1>

  <div class="buttons">
    <button class="tool-btn" onclick="goToImproveAccount()" id="btn1" disabled>
      <i class="fa-brands fa-tiktok"></i> <span id="btn1Text">Improve Your TikTok Account</span>
    </button>
  </div>

  <!-- LINK SUBMISSION BOX -->
  <div class="link-box">
    <h3 id="inputLabel">Enter TikTok Profile Link</h3>
    <span class="example-txt" id="exampleLabel">Example: https://tiktok.com</span>
    
    <div class="input-group">
      <input type="text" id="chanLink" class="link-input" oninput="validateLiveInput()" placeholder="https://tiktok.com">
      <button id="ctrlBtn" class="action-btn upload-style" onclick="handleLinkAction()" disabled>Upload</button>
    </div>
    
    <span class="hint-txt" id="hintLabel">Remove everything after the username for the link to be accepted.</span>
    <div id="notify" class="notify-msg"></div>
  </div>
</div>

<footer>
  <div class="footer-text" id="footerText">
    © 2026 TikTok Promotion Center. All rights reserved.<br>
    Grow your presence, boost engagement, and reach more people.
  </div>
</footer>

<div class="bottom-nav">
  <a class="nav-item active" href="index.html"><span>🏠</span><span class="nav-txt" id="navHome"></span></a>
  <a class="nav-item" href="services.html"><span>🛠</span><span class="nav-txt" id="navServices"></span></a>
  <a class="nav-item" href="vip.html"><span>💎</span><span class="nav-txt" id="navVip"></span></a>
  <a class="nav-item" href="bonus.html"><span>🎁</span><span class="nav-txt" id="navBonus"></span></a>
  <a class="nav-item" href="regulations.html"><span>📜</span><span class="nav-txt" id="navRules"></span></a>
</div>

<a href="tiktok.html" class="watermark" style="position:fixed;right:20px;bottom:100px;font-size:55px;color:#fff;opacity:0.75;cursor:pointer;z-index:3000;transition:.3s;" onmouseover="this.style.color='#ff0050'" onmouseout="this.style.color='#fff'">
  <i class="fa-brands fa-tiktok"></i>
</a>

<script>
const TIKTOK_HANDLE_REGEX = /^https:\/\/(www\.)?tiktok\.com\/@[A-Za-z0-9_\-\.]+$/;

const urlParams = new URLSearchParams(window.location.search);
const tokenQuery = urlParams.get("auth_token") || urlParams.get("token") || "";
const urlLang = urlParams.get("lang") || "";

const PROFILE_API_URL = tokenQuery ? `/api/user/profile?token=${tokenQuery}` : "/api/user/profile";

let databaseUserChannel = null; 
let currentDict = {};
let isUploaded = false;
let currentLangCode = "en";

function applyLang(langCode){
  const t={
    en:{
      title:"TikTok Promotion Center",
      pageTitle:"TikTok Promotion Center",
      btn1:"Improve Your TikTok Account",
      home:"Home",
      services:"Services",
      vip:"VIP",
      bonus:"Bonus",
      rules:"Regulations",
      boxTitle:"Enter TikTok Profile Link",
      exText:"Example: https://tiktok.com",
      ph: "https://tiktok.com",
      hintText:"Remove everything after the username for the link to be accepted.",
      btnUp:"Upload",
      btnCh:"Change",
      errExist:"Profile already exists!",
      errEmpty:"Please provide a valid link address first.",
      successSave:"Profile link saved successfully!",
      footer:"© 2026 TikTok Promotion Center. All rights reserved.\nGrow your presence, boost engagement, and reach more people."
    },
    fr:{
      title:"Centre de Promotion TikTok",
      pageTitle:"Centre de Promotion TikTok",
      btn1:"Améliorer votre compte TikTok",
      home:"Accueil",
      services:"Services",
      vip:"VIP",
      bonus:"Bonus",
      rules:"Règlements",
      boxTitle:"Entrez le lien du profil TikTok",
      exText:"Exemple: https://tiktok.com",
      ph: "https://tiktok.com",
      hintText:"Supprimez tout après le nom d'utilisateur pour que le lien soit accepté.",
      btnUp:"Télécharger",
      btnCh:"Modifier",
      errExist:"Le profil existe déjà!",
      errEmpty:"Veuillez d'abord fournir un lien valide.",
      successSave:"Lien de profil enregistré avec succès!",
      footer:"© 2026 Centre de Promotion TikTok. Tous droits réservés.\nDéveloppez votre présence, augmentez l'engagement et atteignez plus de personnes."
    },
    rw:{
      title:"TikTok Promotion Center",
      pageTitle:"TikTok Promotion Center",
      btn1:"Vugurura Konti yawe ya TikTok",
      home:"Ahabanza",
      services:"Serivisi",
      vip:"VIP",
      bonus:"Ibihembo",
      rules:"Amategeko",
      boxTitle:"Shyiramo Umuyoboro wa TikTok (Link)",
      exText:"Urugero: https://tiktok.com",
      ph: "https://tiktok.com",
      hintText:"Kuraho ibintu byose biri nyuma y'izina ry'uwakoresheje (username) kugira ngo link yakurwe.",
      btnUp:"Shyiraho",
      btnCh:"Hindura",
      errExist:"Iyi Profile isanzwe ihari!",
      errEmpty:"Banza ushyiremo link nshyo mu buryo bwo kuyandika bwo kuryo.",
      successSave:"Profile yawe yabitswe neza!",
      footer:"© 2026 TikTok Promotion Center. Urihano account yawe iratekanye.\nGuteza imbere account yawe no kongera abantu bagukurikirana."
    }
  };

  currentLangCode = langCode;
  currentDict = t[langCode] || t.en;

  document.getElementById("title").innerText=currentDict.title;
  document.getElementById("pageTitle").innerText=currentDict.pageTitle;
  document.getElementById("btn1Text").innerText=currentDict.btn1;
  document.getElementById("inputLabel").innerText=currentDict.boxTitle;
  document.getElementById("exampleLabel").innerText=currentDict.exText;
  document.getElementById("hintLabel").innerText=currentDict.hintText;
  document.getElementById("footerText").innerText=currentDict.footer;

  document.getElementById("navHome").innerText=currentDict.home;
  document.getElementById("navServices").innerText=currentDict.services;
  document.getElementById("navVip").innerText=currentDict.vip;
  document.getElementById("navBonus").innerText=currentDict.bonus;
  document.getElementById("navRules").innerText=currentDict.rules;

  const inputEl = document.getElementById("chanLink");
  const ctrlBtn = document.getElementById("ctrlBtn");
  
  if(!isUploaded){
    inputEl.placeholder = currentDict.ph;
    if(!inputEl.value) ctrlBtn.innerText = currentDict.btnUp;
  } else {
    ctrlBtn.innerText = currentDict.btnCh;
  }
  
  document.getElementById("sidebar").classList.remove("open");
}

function validateLiveInput() {
  if (isUploaded) return;
  const val = document.getElementById("chanLink").value.trim();
  const ctrlBtn = document.getElementById("ctrlBtn");
  
  if (TIKTOK_HANDLE_REGEX.test(val)) {
    ctrlBtn.disabled = false;
  } else {
    ctrlBtn.disabled = true;
  }
}

// Check MongoDB via API when the page loads
function checkDatabaseProfile() {
  fetch(PROFILE_API_URL)
    .then(response => response.json())
    .then(data => {
      if (data && data.tiktok_link) { 
        databaseUserChannel = data.tiktok_link;
        
        const inputEl = document.getElementById("chanLink");
        const ctrlBtn = document.getElementById("ctrlBtn");
        const btn1 = document.getElementById("btn1");

        inputEl.value = databaseUserChannel;
        inputEl.disabled = true;
        btn1.disabled = false;
        
        ctrlBtn.innerText = currentDict.btnCh || "Change";
        ctrlBtn.className = "action-btn change-style";
        ctrlBtn.disabled = false;
        isUploaded = true;
      }
    })
    .catch(err => console.error("Error loading profile from MongoDB:", err));
}

function handleLinkAction() {
  const inputEl = document.getElementById("chanLink");
  const ctrlBtn = document.getElementById("ctrlBtn");
  const notify = document.getElementById("notify");
  const btn1 = document.getElementById("btn1");

  if (!isUploaded) {
    const linkValue = inputEl.value.trim();
    
    // Save to MongoDB via API request
    fetch(PROFILE_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tiktok_link: linkValue })
    })
    .then(res => {
      if(res.ok) {
        notify.className = "notify-msg success-text";
        notify.innerText = currentDict.successSave;
        inputEl.disabled = true;
        btn1.disabled = false;
        
        ctrlBtn.innerText = currentDict.btnCh;
        ctrlBtn.className = "action-btn change-style";
        isUploaded = true;
      }
    })
    .catch(err => console.error("Error saving to MongoDB:", err));

  } else {
    // Change layout verification setup
    if (confirm("Are you sure you want to change this link?")) {
      inputEl.disabled = false;
      inputEl.value = "";
      btn1.disabled = true;
      notify.innerText = "";
      
      ctrlBtn.innerText = currentDict.btnUp;
      ctrlBtn.className = "action-btn upload-style";
      ctrlBtn.disabled = true;
      isUploaded = false;
    }
  }
}

function buildTargetURL(pageName) {
  let params = [];
  if (tokenQuery) params.push(`token=${tokenQuery}`);
  if (currentLangCode) params.push(`lang=${currentLangCode}`);
  return pageName + (params.length > 0 ? "?" + params.join("&") : "");
}

function goToImproveAccount() {
  window.location.href = buildTargetURL("tiktok-improvement.html");
}

window.onload = function() {
  if (urlLang && (urlLang === "en" || urlLang === "fr" || urlLang === "rw")) {
    applyLang(urlLang);
  } else {
    const userLang = navigator.language || navigator.userLanguage;
    const shortLang = userLang.substring(0, 2);
    if (shortLang === "fr") {
      applyLang("fr");
    } else if (shortLang === "rw") {
      applyLang("rw");
    } else {
      applyLang("en");
    }
  }

  // Trigger the MongoDB database checking routine
  checkDatabaseProfile();
};
</script>
</body>
</html>
