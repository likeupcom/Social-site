<!doctype html>
<html lang="en">
//login.html
   <head>
    <meta charset="UTF-8" />
    <title>Login</title>

    <style>
      body {
        background: #0b1220;
        color: white;
        font-family: Arial;
        text-align: center;
        padding-top: 60px;
      }

      form {
        background: #111827;
        display: inline-block;
        padding: 30px;
        border-radius: 10px;
        width: 300px;
      }

      input {
        width: 90%;
        padding: 10px;
        margin: 8px 0;
        border: none;
        border-radius: 6px;
      }

      button {
        width: 95%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #38bdf8;
        color: black;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        background: gray;
      }

      .msg {
        margin-top: 10px;
        color: #f87171;
        font-size: 14px;
      }

      a {
        color: #38bdf8;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <h2>Login to NS Platform</h2>

    <form id="loginForm">
      <input
        type="text"
        name="username"
        id="username"
        placeholder="Username"
        required
      />

      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password (numbers only)"
        required
      />

      <button type="submit" id="loginBtn" disabled>Login</button>

      <div class="msg" id="msg"></div>
    </form>

    <p><a href="/forgot.html">Forgot Password?</a></p>
    <p>Don't have account? <a href="/signup.html">Signup</a></p>

    <script>
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const btn = document.getElementById("loginBtn");
      const msg = document.getElementById("msg");
      const form = document.getElementById("loginForm");

      function validate() {
        const userValid = /^[a-zA-Z0-9]+$/.test(username.value);
        const passValid = /^[0-9]+$/.test(password.value);

        if (username.value && !userValid) {
          msg.innerText = "Username must contain letters and numbers only";
        } else if (password.value && !passValid) {
          msg.innerText = "Password must contain numbers only";
        } else {
          msg.innerText = "";
        }

        btn.disabled = !(userValid && passValid);
      }

      username.addEventListener("input", validate);
      password.addEventListener("input", validate);

      // Submit data using asynchronous fetch to preserve auth cookies
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.style.color = "#38bdf8";
        msg.innerText = "Verifying credentials...";

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: username.value,
              password: password.value
            })
          });

          // Check if server validated password and issued redirect home
          if (response.redirected) {
            window.location.href = response.url;
          } else {
            msg.style.color = "#f87171";
            const errorText = await response.text();
            msg.innerText = errorText;
          }
        } catch (err) {
          msg.style.color = "#f87171";
          msg.innerText = "Network transmission error.";
        }
      });
    </script>
  </body>
</html>
