<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS Platform - Video Accelerator Engine</title>

<style>
/* ================= YOUR ORIGINAL STYLE (UNCHANGED) ================= */
:root {
    --bg-color: #0a0a12;
    --surface-color: rgba(18, 18, 32, 0.6);
    --border-color: rgba(255, 255, 255, 0.08);
    --neon-cyan: #00f2fe;
    --neon-pink: #ff007f;
    --text-primary: #ffffff;
    --text-secondary: #a0a0bd;
    --success-green: #39ff14;
    --glass-blur: blur(16px);
}

* { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }

body {
    background: var(--bg-color);
    color: white;
    padding: 20px;
}

.panel {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
}

.grid-layout {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:10px;
}

.card {
    background: rgba(255,255,255,0.03);
    padding: 10px;
    border-radius: 10px;
}

.btn {
    padding: 8px 12px;
    border:1px solid cyan;
    background:transparent;
    color:cyan;
}

.btn-action {
    background: linear-gradient(90deg, cyan, pink);
    color:black;
}
</style>
</head>

<body>

<div class="panel">
    <h2>NS PLATFORM</h2>
</div>

<!-- LOCKOUT -->
<div id="lockoutWorkspace" class="panel" style="display:none;">
    <h3>LOCKED</h3>
    <div id="lockoutClock">03:00:00</div>
</div>

<!-- MAIN -->
<div id="regularWorkspace">

    <div class="panel">
        <h3>Regulations</h3>
        <div id="regulationsContainer"></div>
        <button id="acceptRegulationsBtn" class="btn btn-action" disabled>Accept</button>
    </div>

    <div class="panel">
        <h3>Board</h3>
        <div class="grid-layout" id="activeBoardGrid"></div>
    </div>

    <div class="panel">
        <h3>Waiting List</h3>
        <div class="grid-layout" id="waitingListGrid"></div>
    </div>

    <div class="panel">
        <h3>Upload</h3>
        <input id="youtubeLinkInput">
        <button id="submitVideoBtn" class="btn btn-action">Upload</button>
    </div>

</div>

<script>

/* ================= BACKEND CONNECTION ================= */
const API_BASE = "http://localhost:3000/api";

/* ================= STATE ================= */
let activeBoard = [];
let waitingList = [];
let localUserSessionId = null;
let sequenceIndex = 0;

/* ================= GET USER ================= */
async function initUser() {
    const token = localStorage.getItem("token");

    const res = await fetch(`${API_BASE}/me`, {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    localUserSessionId = data.userId;
}

/* ================= LOAD DATA ================= */
async function loadSystemData() {
    const res = await fetch(`${API_BASE}/state`);
    const data = await res.json();

    activeBoard = data.activeBoard;
    waitingList = data.waitingList;

    render();
}

/* ================= SAVE ================= */
async function save() {
    await fetch(`${API_BASE}/state/save`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ activeBoard, waitingList })
    });
}

/* ================= RENDER ================= */
function render() {

    const board = document.getElementById("activeBoardGrid");
    const wait = document.getElementById("waitingListGrid");

    board.innerHTML = "";
    wait.innerHTML = "";

    activeBoard.forEach((u, i) => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <p>${u.channelTitle}</p>
            <button class="btn btn-action" onclick="view(${i})">Visit</button>
        `;
        board.appendChild(div);
    });

    waitingList.forEach(u => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <p>${u.channelTitle}</p>
            <button onclick="vote('${u.userId}')">Vote</button>
        `;
        wait.appendChild(div);
    });
}

/* ================= VIEW CLICK ================= */
async function view(i) {
    const u = activeBoard[i];

    window.open(u.youtubeLink, "_blank");

    await fetch(`${API_BASE}/click`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ userId: u.userId })
    });

    loadSystemData();
}

/* ================= VOTE ================= */
async function vote(id) {
    await fetch(`${API_BASE}/vote`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            targetUserId: id,
            voterId: localUserSessionId
        })
    });

    loadSystemData();
}

/* ================= SUBMIT VIDEO ================= */
document.getElementById("submitVideoBtn").onclick = async () => {

    const url = document.getElementById("youtubeLinkInput").value;

    await fetch(`${API_BASE}/video/submit`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            userId: localUserSessionId,
            youtubeLink: url
        })
    });

    loadSystemData();
};

/* ================= START APP ================= */
window.onload = async () => {
    await initUser();
    await loadSystemData();
};

</script>

</body>
</html>
