<script>
function cleanYouTubeUrl(rawUrl) {
    try {
        const parsed = new URL(rawUrl.trim());

        const allowedHosts = [
            "youtube.com",
            "www.youtube.com",
            "m.youtube.com",
            "youtu.be"
        ];

        if (!allowedHosts.includes(parsed.hostname)) {
            return null;
        }

        if (parsed.hostname === "youtu.be") {
            const videoId = parsed.pathname.replace("/", "").split("?")[0];
            return `https://youtu.be/${videoId}`;
        }

        if (parsed.pathname.startsWith("/watch")) {
            const videoId = parsed.searchParams.get("v");
            if (!videoId) return null;

            return `https://www.youtube.com/watch?v=${videoId}`;
        }

        if (parsed.pathname.startsWith("/shorts/")) {
            const shortsId = parsed.pathname.split("/shorts/")[1].split("/")[0];
            return `https://www.youtube.com/shorts/${shortsId}`;
        }

        if (parsed.pathname.startsWith("/live/")) {
            const liveId = parsed.pathname.split("/live/")[1].split("/")[0];
            return `https://www.youtube.com/live/${liveId}`;
        }

        return null;
    } catch {
        return null;
    }
}

document.getElementById("submitVideoBtn").addEventListener("click", async function() {
    const inputField = document.getElementById("youtubeLinkInput");
    const urlValue = inputField.value.trim();

    const cleanedYoutubeUrl = cleanYouTubeUrl(urlValue);

    if (!cleanedYoutubeUrl) {
        alert("Validation Exception: Please provide a valid YouTube VIDEO link.");
        return;
    }

    const savedUsername =
        localStorage.getItem("ns_username") ||
        localStorage.getItem("username") ||
        "Unknown User";

    const savedProfileIcon =
        localStorage.getItem("ns_profile_icon") ||
        localStorage.getItem("profile_icon") ||
        "👤";

    const savedChannelLink =
        localStorage.getItem("ns_channel_link") ||
        localStorage.getItem("channel_link") ||
        "No Channel";

    try {
        const response = await fetch('/api/submit-link', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                youtubeLink: cleanedYoutubeUrl,
                userId: localUserSessionId,
                username: savedUsername,
                profileIcon: savedProfileIcon,
                channelLink: savedChannelLink
            })
        });

        if (response.ok) {
            const statusResult = await response.json();
            alert(statusResult.message || "Asset committed successfully to database matrix!");
            location.reload();
            return;
        }
    } catch(err) {
        console.warn("Backend pipeline down, migrating submission through localized storage architecture layers.");
    }

    let firstEmptyIndex = activeBoard.findIndex(slot => slot.isEmptySlot);

    if (firstEmptyIndex !== -1 && !currentBoardIsFull) {
        activeBoard[firstEmptyIndex] = {
            userId: localUserSessionId,
            username: savedUsername,
            profileIcon: savedProfileIcon,
            channelLink: savedChannelLink,
            channelTitle: "User_" + localUserSessionId.split("_")[2],
            clicks: 0,
            youtubeLink: cleanedYoutubeUrl
        };
        
        let filledCount = activeBoard.filter(slot => !slot.isEmptySlot).length;
        currentBoardIsFull = (filledCount === 10);
        
        saveStateToStorage();
        renderActiveBoard();
        
        alert("Success: You are one of the first 10 users! Placed onto the Main Acceleration Board.");
        
        if (currentBoardIsFull) {
            location.reload();
        } else {
            inputField.value = "";
            document.getElementById("uploadPanel").style.opacity = "0.5";
            document.getElementById("uploadPanel").style.pointerEvents = "none";
        }
    } else {
        const freshQueueObject = {
            userId: localUserSessionId,
            username: savedUsername,
            profileIcon: savedProfileIcon,
            channelLink: savedChannelLink,
            channelTitle: "User_" + localUserSessionId.split("_")[2],
            clicks: 0,
            youtubeLink: cleanedYoutubeUrl,
            appearsReceived: 0
        };

        waitingList.push(freshQueueObject);
        saveStateToStorage();

        inputField.value = "";
        
        if (!evaluateStateTransitions()) {
            renderWaitingList();
            alert("Success: Video committed onto the platform Waiting List successfully.");
            
            sequenceIndex = 0;
            renderVIPSpaces();
            renderActiveBoard();
            document.getElementById("uploadPanel").style.opacity = "0.5";
            document.getElementById("uploadPanel").style.pointerEvents = "none";
        }
    }
});

function renderActiveBoard() {
    const boardContainer = document.getElementById("mainAccelerationBoard");
    boardContainer.innerHTML = "";

    let vipOffset = 4;

    activeBoard.forEach((slot, index) => {
        const elementNode = document.createElement("div");
        elementNode.className = "board-card";

        if (slot.isEmptySlot) {
            elementNode.innerHTML = `
                <div style="color: #555; text-align: center; padding: 20px 0;">
                    <div style="font-size: 24px;">📭</div>
                    <div style="font-size: 12px; margin-top: 5px;">Slot Vacant</div>
                </div>
            `;
        } else {
            let absoluteIndex = vipOffset + index;
            let isCurrentTarget = (systemPhase === "REGULAR_PERIOD" && sequenceIndex === absoluteIndex);
            let displayClicks = slot.clicks || 0;

            if (isCurrentTarget) {
                elementNode.className += " active-target";
            }

            elementNode.innerHTML = `
                <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start;">
                    
                    <div style="display:flex; gap:10px; width:75%;">
                        
                        <div style="font-size:28px;">
                            ${slot.profileIcon || "👤"}
                        </div>

                        <div style="width:100%; overflow:hidden;">
                            
                            <div style="font-weight:bold; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                ${slot.username || slot.channelTitle}
                            </div>
                            
                            <div class="metric-badge-row">
                                <div class="badge-node">👁️ ${displayClicks} view</div>
                                <div class="badge-node">❤️ ${displayClicks} like</div>
                                <div class="badge-node">👤 ${displayClicks} sub</div>
                                <div class="badge-node">💬 ${displayClicks} com</div>
                            </div>
                        </div>
                    </div>

                    <button class="active-redirect-anchor" style="
                        background: ${isCurrentTarget ? '#ff007f' : 'rgba(255,255,255,0.05)'};
                        color: #fff;
                        padding: 10px 14px;
                        border-radius: 4px;
                        font-size: 13px;
                        font-weight: bold;
                        border: 1px solid ${isCurrentTarget ? '#ff007f' : 'rgba(255,255,255,0.1)'};
                        cursor: ${isCurrentTarget ? 'pointer' : 'default'};
                        opacity: ${isCurrentTarget ? '1' : '0.3'};
                        min-width: 85px;
                    ">${isCurrentTarget ? 'Visit' : 'Locked'}</button>
                </div>
            `;

            const linkButton = elementNode.querySelector(".active-redirect-anchor");

            if (isCurrentTarget) {
                linkButton.addEventListener("click", () => {
                    runVerificationTimer(linkButton, slot.youtubeLink, () => {
                        activeBoard[index].clicks = displayClicks + 1;

                        sequenceIndex++;

                        saveStateToStorage();
                        renderVIPSpaces();
                        renderActiveBoard();
                        evaluateStateTransitions();
                    });
                });
            }
        }

        boardContainer.appendChild(elementNode);
    });
}

function renderWaitingList() {
    const container = document.getElementById("waitingQueueContainer");
    container.innerHTML = "";

    if (waitingList.length === 0) {
        container.innerHTML = `<li style="color: #666; padding: 15px; text-align: center;">Waiting pool empty. System parameters stable.</li>`;
        return;
    }

    waitingList.forEach((user, index) => {
        const li = document.createElement("li");
        li.className = "queue-item";

        li.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px; width:75%; overflow:hidden;">
                
                <div style="font-size:28px;">
                    ${user.profileIcon || "👤"}
                </div>

                <div style="overflow:hidden;">
                    <div style="font-weight:bold; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${user.username || user.channelTitle}
                    </div>

                    <div style="font-size:12px; color:#00ffff; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${user.channelLink || "No Channel"}
                    </div>
                </div>
            </div>

            <button class="appeal-btn" data-index="${index}" style="
                background:#ff007f;
                color:#fff;
                border:none;
                padding:8px 14px;
                border-radius:4px;
                cursor:pointer;
                font-size:12px;
                font-weight:bold;
            ">Appeal</button>
        `;

        const appealBtn = li.querySelector(".appeal-btn");

        appealBtn.addEventListener("click", () => {
            waitingList[index].appearsReceived =
                (waitingList[index].appearsReceived || 0) + 1;

            if (waitingList[index].appearsReceived >= 3) {
                waitingList.splice(index, 1);
            }

            saveStateToStorage();
            renderWaitingList();
        });

        container.appendChild(li);
    });
}
</script>
