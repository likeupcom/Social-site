            let absoluteTarget = Date.now() + remainingMs;
            const liveClockRoutine = setInterval(() => {
                let currentDelta = absoluteTarget - Date.now();
                if (currentDelta <= 0) {
                    clearInterval(liveClockRoutine);
                    localStorage.removeItem("ns_lockout_lift_time");
                    window.location.reload();
                } else {
                    let hrs = Math.floor(currentDelta / (3600000));
                    let mins = Math.floor((currentDelta % 3600000) / 60000);
                    let secs = Math.floor((currentDelta % 60000) / 1000);
                    document.getElementById("countdownTimerBox").innerText = 
                        `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function renderWaitingList() {
            const container = document.getElementById("waitingQueueContainer");
            container.innerHTML = "";

            if (waitingList.length === 0) {
                container.innerHTML = `<li style="color: #666; padding: 15px; text-align: center;">${activeDictionary.waitingEmpty}</li>`;
                return;
            }

            waitingList.forEach((user, index) => {
                const li = document.createElement("li");
                li.className = "queue-item";
                
                li.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

        function evaluateStateTransitions() {
            if (!currentBoardIsFull) return false;

            let maxSequenceThreshold = 4 + activeBoard.length;

            if (sequenceIndex >= maxSequenceThreshold) {
                systemPhase = "APPEARING_PERIOD";
                saveStateToStorage();
                executeAppearingPhaseRoutine();
                return true;
            }
            return false;
        }

        // Chronological FIFO Waiting List & Advanced Transition Replacement Engine
        function executeAppearingPhaseRoutine() {
            document.getElementById("appearingPeriodOverlay").style.display = "flex";
            
            waitingList.forEach(user => {
                user.appearsReceived = (user.appearsReceived || 0) + 1;
            });

            let localUserWasActive = activeBoard.some(u => u.userId === localUserSessionId);

            // Populate the inactive users pool with the outgoing active board users before flushing
            let oldActiveUsers = activeBoard.filter(slot => !slot.isEmptySlot);
            justBecameInactivePool = [...justBecameInactivePool, ...oldActiveUsers];

            let nextActiveBoard = [];
            let remainingWaitingList = [];

            // Chronological parsing loop: Top entries (uploaded earliest) move up. If evicted by 3 appeals, skip to the next in queue.
            for (let i = 0; i < waitingList.length; i++) {
                let currentCandidate = waitingList[i];
                if (currentCandidate.appearsReceived >= 3) {
                    continue; // Evicted! Skipped to let the next user in the waiting list slide forward
                }
                
                if (nextActiveBoard.length < 10) {
                    nextActiveBoard.push(currentCandidate);
                } else {
                    remainingWaitingList.push(currentCandidate);
                }
            }

            // Fallback Engine: If queue runs dry, pull randomly from the recently inactive pool
            while (nextActiveBoard.length < 10 && justBecameInactivePool.length > 0) {
                const randomPickIndex = Math.floor(Math.random() * justBecameInactivePool.length);
                const fallbackReplacement = justBecameInactivePool.splice(randomPickIndex, 1)[0];
                
                fallbackReplacement.appearsReceived = 0;
                fallbackReplacement.clicks = 0;
                nextActiveBoard.push(fallbackReplacement);
            }

            // Hard Fallback: If pools are fully depleted, inject system core seed nodes
            while (nextActiveBoard.length < 10) {
                nextActiveBoard.push({
                    userId: "system_node_" + Math.floor(Math.random() * 10000),
                    username: "SystemNode",
                    channelTitle: "System Accelerated Feed",
                    channelLink: "https://youtube.com/@system",
                    clicks: 0,
                    youtubeLink: "https://youtube.com"
                });
            }

            // Reconstruct active board dataset
            activeBoard = nextActiveBoard.map(element => {
                return {
                    userId: element.userId,
                    username: element.username || element.channelTitle,
                    channelTitle: element.channelTitle,
                    channelLink: element.channelLink || "https://youtube.com",
                    clicks: 0,
                    youtubeLink: element.youtubeLink
                };
            });

            waitingList = remainingWaitingList;
            justBecameInactivePool = []; 
            sequenceIndex = 0;
            systemPhase = "REGULAR_PERIOD";

            // Run look-ahead sweep immediately after reset to handle empty VIP blocks seamlessly
            ensureValidSequenceTarget();

            saveStateToStorage();
            document.getElementById("appearingPeriodOverlay").style.display = "none";

            if (localUserWasActive) {
                forceLocalUserLockout();
            } else {
                renderVIPSpaces();
                renderActiveBoard();
                renderWaitingList();
                updateMetricsDisplayPanel();
                updateUploadPanelState();
            }
        }

        document.getElementById("submitVideoBtn").addEventListener("click", async function() {
            const inputField = document.getElementById("youtubeLinkInput");
            const rawUrlValue = inputField.value.trim();

            if (!rawUrlValue) {
                alert(activeDictionary.provideUrlErr);
                return;
            }

            let finalCleanedUrl = "";
            try {
                const urlObj = new URL(rawUrlValue);
                if (urlObj.hostname.includes("youtube.com") && urlObj.pathname === "/watch" && urlObj.searchParams.has("v")) {
                    finalCleanedUrl = "https://www.youtube.com/watch?v=" + urlObj.searchParams.get("v");
                } else if (urlObj.hostname.includes("youtu.be")) {
                    finalCleanedUrl = "https://youtu.be" + urlObj.pathname;
                } else {
                    alert(activeDictionary.validationVideoErr);
                    return;
                }
            } catch(e) {
                alert(activeDictionary.validationUrlErr);
                return;
            }

            try {
                const response = await fetch('/api/submit-link', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        youtubeLink: finalCleanedUrl,
                        userId: localUserSessionId,
                        username: activeUsername,
                        channelLink: activeChannelLink
                    })
                });

                if (response.ok) {
                    const statusResult = await response.json();
                    localStorage.setItem("ns_upload_time", Date.now().toString());
                    alert(statusResult.message || "Video Asset committed safely!");
                    await loadSystemData();
                    renderVIPSpaces();
                    renderActiveBoard();
                    renderWaitingList();
                    updateUploadPanelState();
                    inputField.value = "";
                    return;
                }
            } catch(err) {
                console.warn("Backend pipeline offline, simulating local storage injection.");
            }

            let firstEmptyIndex = activeBoard.findIndex(slot => slot.isEmptySlot);

            if (firstEmptyIndex !== -1 && !currentBoardIsFull) {
                activeBoard[firstEmptyIndex] = {
                    userId: localUserSessionId,
                    username: activeUsername,
                    channelTitle: "User_" + localUserSessionId.split("_")[2], 
                    channelLink: activeChannelLink,
                    clicks: 0,
                    youtubeLink: finalCleanedUrl 
                };
                
                let filledCount = activeBoard.filter(slot => !slot.isEmptySlot).length;
                currentBoardIsFull = (filledCount === 10);
                
                localStorage.setItem("ns_upload_time", Date.now().toString());
                saveStateToStorage();
                renderActiveBoard();
                updateUploadPanelState();
                
                alert(activeDictionary.dbSuccessBoard);
                
                if (currentBoardIsFull) {
                    evaluateStateTransitions();
                } else {
                    inputField.value = "";
                }
            } else {
                const freshQueueObject = {
                    userId: localUserSessionId,
                    username: activeUsername,
                    channelTitle: "User_" + localUserSessionId.split("_")[2], 
                    channelLink: activeChannelLink,
                    clicks: 0,
                    youtubeLink: finalCleanedUrl, 
                    appearsReceived: 0
                };

                // Array push naturally preserves FIFO rules by ordering earliest links at the front (index 0)
                waitingList.push(freshQueueObject);
                localStorage.setItem("ns_upload_time", Date.now().toString());
                saveStateToStorage();

                inputField.value = "";
                
                if (!evaluateStateTransitions()) {
                    renderWaitingList();
                    updateUploadPanelState();
                    alert(activeDictionary.dbSuccessQueue);
                    
                    ensureValidSequenceTarget();
                    renderVIPSpaces();
                    renderActiveBoard();
                }
            }
        });

        window.addEventListener("DOMContentLoaded", async () => {
            applyDynamicLocalization(); 
            instantiateComplianceGateway();
            if (!checkLockoutState()) {
                await loadSystemData();
                buildRegulationsPanel();
                renderVIPSpaces();
                renderActiveBoard();
                renderWaitingList();
                updateUploadPanelState();
                evaluateStateTransitions();
                initializeLiveUpdateEngine(); 
            }
        });
    </script>
